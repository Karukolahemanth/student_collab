{% extends "base.html" %}
{% block title %}Register — CollabHub{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-header">
            <div class="auth-logo">⬡</div>
            <h1 class="auth-title">Join CollabHub</h1>
            <p class="auth-sub">Create your free student account</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST" class="auth-form" id="register-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       placeholder="Choose a unique username"
                       required minlength="3" maxlength="30"
                       autocomplete="username" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-eye-wrap">
                    <input type="password" id="password" name="password"
                           placeholder="At least 6 characters"
                           required minlength="6"
                           autocomplete="new-password" />
                    <button type="button" class="eye-btn" onclick="togglePassword('password', this)">👁</button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="input-eye-wrap">
                    <input type="password" id="confirm_password" name="confirm_password"
                           placeholder="Repeat your password"
                           required
                           autocomplete="new-password" />
                    <button type="button" class="eye-btn" onclick="togglePassword('confirm_password', this)">👁</button>
                </div>
                <span class="field-hint" id="pw-match-hint"></span>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="register-btn">
                Create Account
            </button>
        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{{ url_for('home') }}">Sign in</a>
        </p>

    </div>

    <!-- Decorative blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
</div>
{% endblock %}
