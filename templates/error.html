<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error {{ code }} — CollabHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0d0d1a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .wrap { max-width: 480px; }
        .glow {
            position: fixed; width: 500px; height: 500px; pointer-events: none;
            background: radial-gradient(circle, rgba(124,58,237,0.15) 0%, transparent 70%);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .code {
            font-size: 7rem; font-weight: 800; letter-spacing: -0.05em; line-height: 1;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 12px;
        }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 10px; }
        p  { color: #94a3b8; max-width: 360px; margin: 0 auto 28px; font-size: 0.95rem; line-height: 1.6; }
        a {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 11px 24px; border-radius: 8px;
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff; text-decoration: none; font-weight: 600; font-size: 0.9rem;
            transition: opacity 0.2s;
        }
        a:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="wrap">
        <div class="code">{{ code }}</div>
        <h1>{{ "Page Not Found" if code == 404 else "Internal Server Error" }}</h1>
        <p>{{ message }}</p>
        <a href="/">← Go Home</a>
    </div>
</body>
</html>
