{% extends "base.html" %}
{% block title %}Error {{ code }} — CollabHub{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-glow"></div>
    <div class="error-code">{{ code }}</div>
    <h1 class="error-title">{{ "Not Found" if code == 404 else "Internal Server Error" }}</h1>
    <p class="error-msg">{{ message }}</p>
    <div class="error-actions">
        <a href="{{ url_for('dashboard') if session.username else url_for('home') }}" class="btn btn-primary">
            ← Go Home
        </a>
    </div>
</div>
{% endblock %}
