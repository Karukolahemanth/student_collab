{% extends "base.html" %}
{% block title %}Create Assessment — CollabHub{% endblock %}

{% block content %}
<div class="page-wrapper" style="max-width:760px;">

    <div class="page-header">
        <div>
            <h1 class="page-title">✏️ Create Assessment</h1>
            <p class="page-sub">Build a quiz with multiple choice questions</p>
        </div>
        <a href="{{ url_for('assessments') }}" class="btn btn-ghost">← Back</a>
    </div>

    <form action="{{ url_for('create_assessment') }}" method="POST" id="assessment-form">

        <!-- Title & Description -->
        <div class="card-section">
            <div class="form-group">
                <label for="title">Assessment Title *</label>
                <input type="text" id="title" name="title" placeholder="e.g. Python Basics Quiz" required maxlength="120" />
            </div>
            <div class="form-group" style="margin-top:14px;">
                <label for="description">Description <span class="optional">(optional)</span></label>
                <textarea id="description" name="description" rows="2" placeholder="What is this quiz about?"></textarea>
            </div>
        </div>

        <!-- Questions -->
        <div id="questions-container">
            <!-- Injected by JS -->
        </div>

        <button type="button" class="btn btn-ghost" id="add-question-btn" onclick="addQuestion()">
            + Add Question
        </button>

        <div class="modal-actions" style="margin-top:28px;">
            <a href="{{ url_for('assessments') }}" class="btn btn-ghost">Cancel</a>
            <button type="submit" class="btn btn-primary" id="submit-assessment-btn">🚀 Publish Assessment</button>
        </div>
    </form>

</div>
{% endblock %}

{% block scripts %}
<script>
let qCount = 0;

function addQuestion() {
    qCount++;
    const container = document.getElementById('questions-container');
    const div = document.createElement('div');
    div.className = 'question-block';
    div.id = `q-block-${qCount}`;
    div.innerHTML = `
        <div class="question-header">
            <span class="question-num">Question ${qCount}</span>
            <button type="button" class="btn-icon btn-delete" onclick="removeQuestion(${qCount})" title="Remove">🗑</button>
        </div>
        <div class="form-group">
            <label>Question Text *</label>
            <textarea name="question_${qCount}" rows="2" placeholder="Enter your question here…" required></textarea>
        </div>
        <div class="options-grid">
            <div class="form-group">
                <label>Option A *</label>
                <input type="text" name="opt_${qCount}_a" placeholder="Option A" required />
            </div>
            <div class="form-group">
                <label>Option B *</label>
                <input type="text" name="opt_${qCount}_b" placeholder="Option B" required />
            </div>
            <div class="form-group">
                <label>Option C <span class="optional">(optional)</span></label>
                <input type="text" name="opt_${qCount}_c" placeholder="Option C" />
            </div>
            <div class="form-group">
                <label>Option D <span class="optional">(optional)</span></label>
                <input type="text" name="opt_${qCount}_d" placeholder="Option D" />
            </div>
        </div>
        <div class="form-group">
            <label>Correct Answer *</label>
            <div class="radio-group">
                <label class="radio-label"><input type="radio" name="correct_${qCount}" value="A" required /> A</label>
                <label class="radio-label"><input type="radio" name="correct_${qCount}" value="B" /> B</label>
                <label class="radio-label"><input type="radio" name="correct_${qCount}" value="C" /> C</label>
                <label class="radio-label"><input type="radio" name="correct_${qCount}" value="D" /> D</label>
            </div>
        </div>
    `;
    container.appendChild(div);
}

function removeQuestion(n) {
    const el = document.getElementById(`q-block-${n}`);
    if (el) el.remove();
}

// Start with one question
addQuestion();
</script>
{% endblock %}
